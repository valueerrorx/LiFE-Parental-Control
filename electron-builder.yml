appId: "org.tuxfamily.life-parental-control"
# Install dir /opt/LiFE_Parental_Control (no spaces); UI name set via linux.desktop.
productName: "LiFE_Parental_Control"
copyright: "Copyright © 2024 Thomas Michael Weissel"

# Packaged Electron ignores NODE_OPTIONS (dev shells often set it); avoids startup warning and matches production expectations.
electronFuses:
  enableNodeOptionsEnvironmentVariable: false

directories:
  output: "dist"

# electron-vite compiles everything into out/; only that + package.json need to be packaged
files:
  - out/**/*
  - package.json

extraResources:
  - from: "kiosk"
    to: "kiosk"
    filter: ["**/*.kiosk"]
  - from: "profiles"
    to: "profiles"
    filter: ["**/*.profile"]
  - from: "images"
    to: "images"
  - from: "hagezi"
    to: "hagezi"
    filter: ["**/*.txt"]
  - from: "packaging/polkit"
    to: "polkit"
    filter: ["**/*.rules"]
  - from: "daemon"
    to: "daemon"
    filter: ["**/*.js"]
  - from: "packaging/systemd/parental-control.service"
    to: "systemd/parental-control.service"
  - from: "packaging/life-parental-install.sh"
    to: "life-parental-install.sh"
  - from: "packaging/life-parental-lockdown.sh"
    to: "life-parental-lockdown.sh"
  - from: "packaging/99-life-parental-dns"
    to: "99-life-parental-dns"
  - from: "packaging/app-monitor-background-excludes.json"
    to: "app-monitor-background-excludes.json"

extraFiles:
  - from: "images/icons/16x16.png"
    to: "usr/share/icons/hicolor/16x16/apps/life-parental-control.png"
  - from: "images/icons/32x32.png"
    to: "usr/share/icons/hicolor/32x32/apps/life-parental-control.png"
  - from: "images/icons/48x48.png"
    to: "usr/share/icons/hicolor/48x48/apps/life-parental-control.png"
  - from: "images/icons/64x64.png"
    to: "usr/share/icons/hicolor/64x64/apps/life-parental-control.png"
  - from: "images/icons/128x128.png"
    to: "usr/share/icons/hicolor/128x128/apps/life-parental-control.png"
  - from: "images/icons/256x256.png"
    to: "usr/share/icons/hicolor/256x256/apps/life-parental-control.png"
  - from: "images/icons/512x512.png"
    to: "usr/share/icons/hicolor/512x512/apps/life-parental-control.png"

linux:
  executableName: life-parental-control
  desktop:
    entry:
      Name: "LiFE Parental Control"
      Icon: "life-parental-control.png"
      StartupWMClass: "life-parental-control"
      X-GNOME-WMClass: "life-parental-control"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: System
  maintainer: "Thomas Michael Weissel"
  description: "Parental controls for Linux: kiosk lockdown, web filter, screen time, app blocking and daily app quotas."
  icon: images/pc.png

deb:
  depends:
    - nodejs
    - dnsmasq
    - apparmor
    - apparmor-utils
  afterInstall: packaging/debian/postinst.sh
  afterRemove: packaging/debian/postrm.sh
